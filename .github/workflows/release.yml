name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Verify module
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build ./...
      # Go modules publish from the git tag itself — `go get github.com/nomba/nomba-go@<tag>`
      # needs no registry step. Cut a GitHub Release so the tag is discoverable.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for details." \
            --verify-tag
